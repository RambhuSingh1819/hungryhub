<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - HungryHub</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>

<body class="admin-auth">


    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">Admin Panel</div>

            <div class="nav-links">
                <a th:href="@{/}">User Site</a>
                <a th:href="@{/admin/login}">Login</a>
                <a th:href="@{/admin/register}">Register</a>
            </div>
        </div>
    </nav>

    <!-- LOGIN CARD -->
    <div class="auth-container">
        <div class="auth-card">
            <h2>Admin Login</h2>

            <form id="adminLoginForm">
                <div class="form-group">
                    <label>Admin ID or Email</label>
                    <input type="text" id="identifier" name="identifier" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Login</button>
            </form>

            <p class="text-center" style="margin-top: 10px;">
                <a th:href="@{/admin/forgot-password}">Forgot password?</a>
            </p>

            <p class="text-center">
                Don&apos;t have an account?
                <a th:href="@{/admin/register}">Register here</a>
            </p>

            <div id="message" class="message"></div>
        </div>
    </div>

    <script th:src="@{/js/admin-auth.js}"></script>
</body>

</html>
