<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login - HungryHub</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>

<body class="user-auth">
    <!-- NAVBAR (keeps layout consistent) -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">Food Delivery</div>

            <div class="nav-links">
                <a th:href="@{/}">Home</a>
                <a th:href="@{/user/login}">Login</a>
                <a th:href="@{/user/register}">Register</a>
            </div>
        </div>
    </nav>

    <!-- LOGIN CARD -->
    <div class="auth-container">
        <div class="auth-card login-card">

            <h2 class="login-title">Welcome back</h2>
            <p class="login-subtitle">
                Login to track your orders, reorder favourites and enjoy fast checkout.
            </p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="identifier">Email or Phone Number</label>
                    <input type="text" id="identifier" name="identifier" required
                        placeholder="you@example.com or 9876543210">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>

                <div class="form-footer-row">
                    <a th:href="@{/forgot-password}" class="link-small">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Login</button>
            </form>

            <p class="auth-bottom-text">
                Don't have an account?
                <a th:href="@{/user/register}">Register here</a>
            </p>

            <div id="message" class="message"></div>
        </div>
    </div>

    <script th:src="@{/js/user-auth.js}"></script>
</body>

</html>
