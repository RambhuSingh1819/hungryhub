spring.application.name=FoodDeliveryApplication

# ======================
# Server Configuration
# ======================
server.port=${PORT:4000}


server.servlet.context-path=/

# ======================
# Database Configuration (MySQL Database - Active)
# ======================

# Filled using your HOST (gateway01.ap-southeast-1.prod.aws.tidbcloud.com) and PORT (4000)
# ===============================
# Database Configuration (Active)
# ===============================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# URL with TiDB's specific SSL requirement (sslMode=VERIFY_IDENTITY)
spring.datasource.url=jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/fooddilivery?sslMode=VERIFY_IDENTITY

# Hardcoded credentials to bypass IDE variable issues
spring.datasource.username=${username}
spring.datasource.password=${password}

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# H2 Database Configuration (Inactive)
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.name=rest_api
# spring.datasource.url=jdbc:h2:file:./data/hungryhub;DB_CLOSE_DELAY=-1;MODE=MySQL
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true

# ======================
# H2 Console (Disabled)
# ======================
spring.h2.console.enabled=false
# spring.h2.console.path=/h2-console

# ======================
# Redis Configuration
# ======================
spring.cache.type=${CACHE_TYPE:simple}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000

# ======================
# Hikari Connection Pool Optimizations
# ======================
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=HungryHubHikariCP


# ======================
# Thymeleaf Configuration
# ======================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# ======================
# Static Resources
# ======================
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=3600

# ======================
# File Upload
# ======================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ======================
# JWT Configuration
# ======================
app.jwt.secret=your-secret-key-change-this-in-production-use-a-strong-random-key
app.jwt.expiration=86400000

# ======================
# OTP Configuration
# ======================
app.otp.expiration=600000
app.otp.length=6

# ======================
# Payment Feature Flags (your custom flags)
# ======================
app.payment.googlepay.enabled=true
app.payment.phonepe.enabled=true
app.payment.qr.enabled=true

# ======================
# Admin Configuration
# ======================
app.admin.default-password=admin123

# ======================
# Razorpay Payment Gateway (TEST / LIVE via env vars)
# ======================
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.currency=INR
razorpay.company.name=Hungry-hub App

# ======================
# OpenAI Configuration
# ======================
openai.api.key=${OPENAI_API_KEY:}
openai.api.base-url=https://api.openai.com/v1
openai.chat.model=gpt-4.1-mini
openai.image.model=gpt-image-1

# ======================
# Email (Gmail / SMTP Configuration for OTP)
# ======================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:foodapp.sender.otp@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:grzgjxhfvdyfinll}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.from=${SPRING_MAIL_FROM:foodapp.sender.otp@gmail.com}

